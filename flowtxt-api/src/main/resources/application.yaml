spring:
  application:
    name: flowtxt-api
  # Java 21 virtual threads: cheap blocking-I/O concurrency without a
  # different servlet container (the modern answer to why projects used to
  # pick Undertow).
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env
  profiles:
    active: dev

  # Boot 4 moved MongoDB connection properties to spring.mongodb.*
  mongodb:
    uri: mongodb://root:rootpassword@localhost:27017/flowtxt?authSource=admin
    representation:
      uuid: standard
  # Boot 3 renamed Redis properties under spring.data.redis
  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      INDENT_OUTPUT: true

server:
  port: 8080

# JWT — the secret is a DEV-ONLY placeholder. Production MUST override it via
# the JWT_SECRET environment variable (e.g. `openssl rand -base64 48`).
jwt:
  secret: ${JWT_SECRET:change-me-dev-only-please-use-a-long-random-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN:dev-only-twilio-placeholder}
  phone-number: ${TWILIO_PHONE_NUMBER}

logging:
  level:
    root: INFO
    ca.flowtxt: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.data.mongodb.repository.query: DEBUG
    org.mongodb.driver.protocol.command: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
