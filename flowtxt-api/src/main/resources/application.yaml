spring:
  application:
    name: flowtxt-api
  # Java 21 virtual threads: cheap blocking-I/O concurrency without a
  # different servlet container (the modern answer to why projects used to
  # pick Undertow).
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env
  profiles:
    active: dev

  # Twelve-Factor config: the JDBC URL comes from DATABASE_URL (default =
  # local docker-compose Postgres 16). No schema auto-ddl — Flyway owns it.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowtxt}
    username: ${DB_USERNAME:flowtxt}
    password: ${DB_PASSWORD:flowtxt}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      INDENT_OUTPUT: true

  # Twelve-Factor factor 9 (disposability): on SIGTERM, stop accepting new
  # requests and give in-flight work up to 30s to finish before exiting.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

# JWT — the secret is a DEV-ONLY placeholder. Production MUST override it via
# the JWT_SECRET environment variable (e.g. `openssl rand -base64 48`).
jwt:
  secret: ${JWT_SECRET:change-me-dev-only-please-use-a-long-random-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

twilio:
  # Empty-safe defaults: outside dev, StartupConfigValidator refuses to boot
  # when these are blank; in dev the fake SMS adapter is used instead.
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

# Login throttling: fixed-window counter per client IP in Redis (shared across
# replicas). Dev defaults below; production overrides via RATE_LIMIT_*.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  limit: ${RATE_LIMIT_LIMIT:20}
  window: ${RATE_LIMIT_WINDOW:1m}
  paths: ${RATE_LIMIT_PATHS:/auth/login}
  client-ip-header: ${RATE_LIMIT_CLIENT_IP_HEADER:X-Forwarded-For}

logging:
  level:
    root: INFO
    ca.flowtxt: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      # Liveness = only the process is alive (Spring's livenessState).
      # Readiness = the service can serve traffic: it must be able to talk
      # to PostgreSQL (custom `postgres` indicator + auto-configured `db`)
      # and Redis (auto-configured `redis`).
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,postgres,db,redis
