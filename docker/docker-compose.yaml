version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: flowtxt-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: flowtxt
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: flowtxt-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
