version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: flowtxt-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flowtxt
      POSTGRES_PASSWORD: flowtxt
      POSTGRES_DB: flowtxt
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowtxt-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
