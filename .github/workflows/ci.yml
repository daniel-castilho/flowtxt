name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # manual rehearsal of any ref on real runners

permissions:
  contents: read
  security-events: write   # SARIF upload from Trivy
  packages: write          # container registry push (when enabled)

jobs:
  build:
    name: Build & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Static analysis of the workflows themselves (schema, ${{ }}
      # expressions, embedded shellcheck) — catches pipeline mistakes before
      # they burn a full runner run.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: ./mvnw test

      # Direct plugin goals (jacoco/spotbugs/dependency-check) resolve
      # cross-module artifacts from the local repository, not the reactor,
      # so a fresh runner needs an install pass before they can run.
      # jacoco.skip keeps this preparatory pass from re-running the
      # lifecycle-bound report/check against skipped tests; coverage is
      # enforced by the dedicated check step below.
      - name: Install reactor artifacts
        if: success()
        run: ./mvnw -B install -DskipTests -Djacoco.skip=true

      - name: JaCoCo coverage check
        if: success()
        run: ./mvnw jacoco:check

      - name: SpotBugs static analysis
        if: success()
        run: ./mvnw spotbugs:check

      # Seeds/persists the NVD mirror so Dependency Check applies deltas
      # instead of re-downloading ~380k records on every run. Bump the key
      # suffix to force a full refresh (last bump: dependency-check 12.2.2
      # fixed the NVD URL-column overflow that corrupted v1 caches).
      - name: Cache OWASP Dependency Check NVD mirror
        if: success()
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-nvd-v2

      - name: OWASP Dependency Check
        if: success()
        env:
          # Repository secret — without a key the NVD throttles updates into
          # hours-long full downloads.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw dependency-check:check

      - name: Integration tests (Docker / Testcontainers)
        if: success()
        run: ./mvnw test -Dtest='*IT' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Production build
        if: success()
        run: ./mvnw clean package

      - name: Upload production jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: flowtxt-api-jar
          path: flowtxt-api/target/flowtxt-api-*.jar

  # Build the production image and verify its supply-chain hygiene.
  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          IMAGE="flowtxt-api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker inspect --format='{{.Id}}' "$IMAGE" > image-digest.txt
          cat image-digest.txt

      - name: Non-root check (must fail on UID 0)
        run: |
          out="$(docker run --rm --entrypoint id "$IMAGE")"
          echo "$out"
          if echo "$out" | grep -q 'uid=0('; then
            echo "FATAL: image runs as root (UID 0)"
            exit 1
          fi
          echo "OK: image runs as non-root ($out)"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM + image digest
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: |
            sbom.cdx.json
            image-digest.txt

      # Release convention (README "Releases & Rollout"): pushes to main get
      # an immutable sha-<short> tag plus the moving edge tag; v* milestone
      # tags additionally publish the semver tag. Rollout deploys by pinning
      # one of those immutable tags.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        if: github.event_name == 'push'
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/flowtxt-api"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS=("$IMAGE:sha-$SHORT_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS+=("$IMAGE:$VERSION")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS+=("$IMAGE:edge")
          fi
          {
            echo "image=$IMAGE"
            printf 'tags=%s\n' "$(IFS=,; echo "${TAGS[*]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            docker tag "flowtxt-api:${{ github.sha }}" "$tag"
            docker push "$tag"
          done

  # Publishes the GitHub Release for v* milestone tags: the production jar
  # (renamed to carry the semver) and the SBOM of the exact shipped image.
  release:
    name: GitHub Release (jar + SBOM)
    needs: [build, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          mv artifacts/flowtxt-api-jar/flowtxt-api-*.jar \
            "release-assets/flowtxt-api-${VERSION}.jar"
          cp artifacts/sbom/sbom.cdx.json \
            "release-assets/flowtxt-api-${VERSION}.sbom.cdx.json"
          ls -l release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            release-assets/*
